name: Build iPhone app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PaintingScan.xcodeproj \
            -target PaintingScan \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PaintingScan.app Payload/
          zip -qr PaintingScan.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: PaintingScan-ipa
          path: PaintingScan.ipa

      - name: Upload build log (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
